name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy scripts tests skills
      - run: uv run python -W error -m unittest discover -v
      - run: uv run python scripts/render.py --check
      - run: git diff --exit-code
      - name: Validate portable shell syntax
        run: find scripts skills -name '*.sh' -exec bash -n {} \;
