name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy scripts tests skills
      - run: uv run python -W error -m unittest discover -v
      - run: uv run python scripts/render.py
      - run: uv run python scripts/render.py --check
      - run: git diff --exit-code
      - name: Validate portable shell syntax
        run: find scripts skills -name '*.sh' -exec bash -n {} \;
