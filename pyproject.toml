[project]
name = "harness"
version = "0.1.0"
description = "Shared native Codex and Claude configuration"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff==0.15.7", "mypy==1.19.1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "D101", "D102", "D103", "D104"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
